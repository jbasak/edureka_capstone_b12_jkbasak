version: "3.9"

# ── Procurement & Vendor Evaluation Assistant ─────────────────────────────────
# ChromaDB is embedded (in-process) — no separate database service needed.
#
# Usage:
#   cp .env.example .env          # fill in GROQ_API_KEY
#   docker compose up --build
#   open http://localhost:8000/docs
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI application ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procurement_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist ChromaDB data across container restarts
      - chroma_data:/app/chroma_db
      # Sample / test data accessible inside the container
      - ./testdata:/app/testdata:ro
      # Persist HuggingFace model cache so it isn't re-downloaded on restart
      - hf_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  chroma_data:
    driver: local
  hf_model_cache:
    driver: local
