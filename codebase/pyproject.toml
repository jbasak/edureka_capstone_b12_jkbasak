[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
 "python-multipart>=0.0.9,<1", "pydantic>=2.8,<3",
 "pydantic-settings>=2.4,<3", "pymupdf>=1.24,<2",
 "pandas>=2.2,<3", "openpyxl>=3.1,<4",
 "qdrant-client>=1.11,<2", "openai>=1.40,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
