version: "3.9"

# ── Procurement & Vendor Evaluation Assistant ─────────────────────────────────
# Services:
#   qdrant  – vector database (persistent local volume)
#   api     – FastAPI application
#
# Usage:
#   cp .env.example .env          # fill in GROQ_API_KEY
#   docker compose up --build
#   open http://localhost:8000/docs
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Qdrant vector database ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: procurement_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"     # REST API
      - "6334:6334"     # gRPC (optional)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI application ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procurement_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override host to the docker service name when running in compose
      - QDRANT_HOST=qdrant
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      # Sample / test data accessible inside the container
      - ./testdata:/app/testdata:ro
      # Persist HuggingFace model cache so it isn't re-downloaded on restart
      - hf_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  qdrant_data:
    driver: local
  hf_model_cache:
    driver: local
